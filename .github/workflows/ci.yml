name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Server and agent tests
        run: |
          python -m pip install -r server/requirements.txt pytest httpx
          python -m pytest -q server/tests
      - name: Python syntax (desktop app, agent, server)
        run: python -m compileall -q hosts_editor hosts_editor_launcher.pyw server
      - name: Console JavaScript syntax
        run: node --check server/hots_server/static/app.js
      - name: ShellCheck deploy scripts
        run: shellcheck server/deploy/*.sh
